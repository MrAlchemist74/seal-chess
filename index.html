<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Тюленьи шахматы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #0f1a24; --panel: #172533; --text: #e8f1f7; --muted: #8fa6b8; --accent: #5cc8ff;
  --light: #dcebf4; --dark: #6f97b4; --sel: rgba(255, 214, 92, .75); --last: rgba(92, 200, 255, .35);
  --check: rgba(255, 70, 70, .7); --dot: rgba(15, 26, 36, .35);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: linear-gradient(180deg, #0a1520, #10263a 60%, #163650) fixed; color: var(--text); font: 15px/1.35 -apple-system, "Segoe UI", Roboto, sans-serif; }
body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 12px 12px 24px; }
h1 { font-size: 20px; margin: 4px 0 2px; letter-spacing: .5px; }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; text-align: center; }
.wrap { width: 100%; max-width: 480px; }
.screen { display: none; } .screen.on { display: block; }
.btn { display: block; width: 100%; padding: 13px 14px; margin: 8px 0; border: 0; border-radius: 12px; background: var(--panel);
  color: var(--text); font-size: 16px; text-align: left; cursor: pointer; }
.btn b { display: block; font-size: 16px; } .btn span { color: var(--muted); font-size: 13px; }
.btn.main { background: var(--accent); color: #062033; } .btn.main span { color: #0b3550; }
.row { display: flex; gap: 8px; } .row .btn { text-align: center; font-size: 14px; padding: 10px; }
.bar { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; min-height: 26px; }
.who { font-weight: 600; } .caps { display: flex; flex-wrap: wrap; gap: 0; min-height: 22px; }
.caps .pc { width: 22px; height: 22px; }
.boardwrap { position: relative; padding: 7px; border-radius: 16px; background: linear-gradient(180deg, #ffffff, #dcebf4 60%, #b9d6e6);
  box-shadow: 0 0 0 2px #7fb0cc, 0 10px 30px rgba(0,0,0,.45), inset 0 -4px 8px rgba(60,110,140,.25); }
.boardwrap::before { content: ""; position: absolute; left: 4%; right: 4%; top: -7px; height: 14px; border-radius: 50%;
  background: radial-gradient(ellipse at 20% 60%, #fff 0 30%, transparent 31%), radial-gradient(ellipse at 55% 50%, #fff 0 34%, transparent 35%),
  radial-gradient(ellipse at 85% 65%, #fff 0 28%, transparent 29%); pointer-events: none; }
.snowfall { position: absolute; inset: 0; overflow: hidden; pointer-events: none; border-radius: 16px; z-index: 3; }
.flake { position: absolute; top: -6px; width: 4px; height: 4px; border-radius: 50%; background: #fff; opacity: .85; box-shadow: 0 0 3px rgba(255,255,255,.8);
  animation: fall linear infinite; }
@keyframes fall { to { transform: translate(var(--dx, 12px), 105%) ; } }
#board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; aspect-ratio: 1; border-radius: 10px; overflow: hidden;
  box-shadow: 0 6px 24px rgba(0,0,0,.35); touch-action: manipulation; user-select: none; }
.sq { position: relative; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; overflow: hidden; }
.sq.l { background: radial-gradient(circle at 30% 25%, #ffffff 0 30%, #eef5f9 70%, #e2edf4); }
.sq.d { background: repeating-linear-gradient(118deg, transparent 0 13px, rgba(255,255,255,.22) 13px 14px, transparent 14px 31px),
  repeating-linear-gradient(32deg, transparent 0 21px, rgba(255,255,255,.14) 21px 22px, transparent 22px 40px),
  linear-gradient(135deg, #a8cfe4, #7fb0cd); }
.gust .sq .pc { animation: sway 1.1s ease-in-out 2; transform-origin: 50% 88%; }
@keyframes sway { 0%,100% { transform: rotate(0) } 35% { transform: rotate(-3.5deg) skewX(-2deg) } 70% { transform: rotate(2deg) } }
.fx { position: fixed; pointer-events: none; z-index: 8; }
.fly { position: fixed; pointer-events: none; z-index: 9; }
.fly .pc { width: 100%; height: 100%; filter: drop-shadow(0 6px 4px rgba(20,50,70,.35)); }
.drop { position: fixed; pointer-events: none; z-index: 9; width: 6px; height: 8px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  background: radial-gradient(circle at 35% 30%, #ffffff, #6fc0ea 60%, #2f86b8); }
.ripple { position: fixed; pointer-events: none; z-index: 8; border-radius: 50%; border: 2px solid rgba(120,200,240,.9); }
.puff { position: fixed; pointer-events: none; z-index: 9; width: 5px; height: 5px; border-radius: 50%; background: #fff; box-shadow: 0 0 4px #fff; }
.gustline { position: fixed; pointer-events: none; z-index: 8; height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.85), transparent); }
.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: -2px 0 8px; }
.levels .btn { margin: 0; text-align: center; padding: 10px 6px; }
.levels .btn b { font-size: 14px; } .levels .btn span { font-size: 11px; }
.sq.last::before, .sq.sel::before, .sq.chk::before { content: ""; position: absolute; inset: 0; }
.sq.last::before { background: var(--last); } .sq.sel::before { background: var(--sel); }
.sq.chk::before { background: radial-gradient(circle, var(--check) 0 45%, transparent 75%); }
.sq .pc { position: absolute; inset: 2%; width: 96%; height: 96%; pointer-events: none; user-select: none; }
.sq.mv::after { content: ""; position: absolute; width: 28%; height: 28%; border-radius: 50%; background: var(--dot); }
.sq.cap::after { content: ""; position: absolute; inset: 4%; border-radius: 50%; border: 5px solid var(--dot); }
.coord { position: absolute; font-size: 10px; font-weight: 700; opacity: .55; pointer-events: none; }
.coord.f { right: 3px; bottom: 1px; } .coord.r { left: 3px; top: 1px; }
.sq.l .coord { color: #6f97b4; } .sq.d .coord { color: #f2f8fb; }
.talk { margin-top: 10px; background: var(--panel); border-radius: 12px; padding: 10px 12px; min-height: 44px; }
.talk .n { color: var(--accent); font-weight: 600; margin-right: 6px; }
.modal { position: fixed; inset: 0; background: rgba(5,10,15,.7); display: none; align-items: center; justify-content: center; z-index: 9; padding: 16px; }
.modal.on { display: flex; }
.card { background: var(--panel); border-radius: 16px; padding: 16px; width: 100%; max-width: 420px; max-height: 90vh; overflow: auto; }
.card h2 { margin: 0 0 10px; font-size: 18px; }
.promo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.promo button { background: var(--light); border: 0; border-radius: 10px; aspect-ratio: 1; padding: 4px; cursor: pointer; }
.promo button .pc { width: 100%; height: 100%; }
.legend { display: grid; grid-template-columns: 72px 1fr; gap: 8px 10px; align-items: center; }
.legend .pc { width: 72px; height: 72px; background: var(--light); border-radius: 10px; }
.legend b { display: block; } .legend span { color: var(--muted); font-size: 13px; }
.result { font-size: 22px; font-weight: 700; margin: 4px 0 8px; }

/* ---------- UI v2: хаб игр, панели, анимации ---------- */
:root { --r: 16px; --gap: 10px; --ice: #bfe3f5; --gold: #f2c14e; --danger: #ff6b6b; --glass: rgba(23,37,51,.72); --line: rgba(255,255,255,.08); }
body { padding: 0 12px 24px; }
.appbar { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; gap: 8px; width: 100%; max-width: 480px; padding: 10px 0 8px;
  background: linear-gradient(180deg, #0a1520 70%, rgba(10,21,32,0)); }
.appbar h1 { margin: 0; font-size: 18px; flex: 1; text-align: center; }
.iconbtn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 18px;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .12s, background .2s; }
.iconbtn:active { transform: scale(.92); } .iconbtn.hidden { visibility: hidden; }
.screen { animation: none; } .screen.on { animation: screenIn .28s cubic-bezier(.2,.8,.3,1); }
@keyframes screenIn { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
.hero { display: flex; gap: 12px; align-items: center; background: linear-gradient(135deg, #18324a, #0f2234); border: 1px solid var(--line);
  border-radius: var(--r); padding: 12px; margin: 4px 0 14px; }
.hero .ava { width: 56px; height: 56px; flex: none; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #2c4a63, #13263a); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.hero .ava .pc { width: 64px; height: 64px; }
.hero .t b { display: block; font-size: 16px; } .hero .t span { color: var(--muted); font-size: 13px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
.tile { position: relative; border: 1px solid var(--line); border-radius: var(--r); padding: 12px 12px 14px; text-align: left; color: var(--text); cursor: pointer;
  background: linear-gradient(160deg, #1c3448, #13263a); overflow: hidden; min-height: 150px; transition: transform .15s, box-shadow .2s; }
.tile:active { transform: scale(.97); }
.tile .art { height: 86px; display: flex; align-items: flex-end; justify-content: center; margin: -4px -4px 6px; }
.tile .art .pc { height: 92px; width: 92px; filter: drop-shadow(0 6px 6px rgba(0,0,0,.35)); transition: transform .3s; }
.tile:hover .art .pc { transform: translateY(-3px) rotate(-3deg); }
.tile b { display: block; font-size: 15px; } .tile span { color: var(--muted); font-size: 12px; }
.tile.soon { opacity: .55; cursor: default; } .tile .badge { position: absolute; top: 8px; right: 8px; font-size: 10px; padding: 3px 7px; border-radius: 999px;
  background: rgba(255,255,255,.1); color: var(--muted); letter-spacing: .3px; }
.tile.hot { box-shadow: 0 0 0 1px rgba(92,200,255,.35), 0 8px 24px rgba(30,120,170,.25); }
.player { display: flex; align-items: center; gap: 8px; padding: 6px 10px; margin: 8px 0; border-radius: 14px; background: var(--glass); border: 1px solid var(--line);
  transition: box-shadow .25s, background .25s; }
.player .ava { width: 30px; height: 30px; border-radius: 50%; background: #1d3448; display: flex; align-items: center; justify-content: center; overflow: hidden; flex: none; }
.player .ava .pc { width: 36px; height: 36px; }
.player .who { flex: 1; font-size: 14px; }
.player.turn { background: rgba(92,200,255,.14); box-shadow: 0 0 0 1px rgba(92,200,255,.55), 0 0 18px rgba(92,200,255,.18); }
.player.turn .who::after { content: " · ходит"; color: var(--accent); font-weight: 500; }
.bubble { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; }
.bubble .ava { width: 34px; height: 34px; border-radius: 50%; flex: none; background: #1d3448; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.bubble .ava .pc { width: 40px; height: 40px; }
.bubble .msg { position: relative; flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 9px 12px; min-height: 38px; font-size: 14px; }
.bubble .msg .n { display: block; color: var(--accent); font-weight: 600; font-size: 12px; margin-bottom: 2px; }
.bubble .msg.pop { animation: pop .3s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { transform: scale(.96); opacity: .4 } to { transform: none; opacity: 1 } }
.caret::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--muted); }
@keyframes blink { 50% { opacity: 0 } }
.actions { display: grid; grid-template-columns: repeat(3, 1fr) 46px; gap: 8px; margin-top: 10px; }
.act { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); padding: 8px 4px; cursor: pointer; font-size: 12px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; transition: transform .12s; }
.act i { font-style: normal; font-size: 18px; } .act:active { transform: scale(.94); }
.act.danger { color: var(--danger); }
.sq.enter .pc { animation: drop .45s cubic-bezier(.2,1.3,.4,1) backwards; }
@keyframes drop { from { transform: translateY(-40%) scale(.7); opacity: 0 } to { transform: none; opacity: 1 } }
.sq.chk::before { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35 } }
.modal { align-items: flex-end; padding: 0; background: rgba(5,10,15,.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.modal .card { border-radius: 22px 22px 0 0; max-width: 520px; padding: 10px 16px 22px; animation: sheetUp .32s cubic-bezier(.2,.9,.3,1); }
.modal .card::before { content: ""; display: block; width: 38px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.18); margin: 0 auto 12px; }
@keyframes sheetUp { from { transform: translateY(100%) } to { transform: none } }
.sheet-title { font-size: 18px; font-weight: 700; margin: 0 0 4px; } .sheet-sub { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
.modal .card .btn { background: #213a50; border: 1px solid var(--line); } .modal .card .btn.main { background: var(--accent); }
.confetti { position: fixed; top: -12px; width: 8px; height: 8px; border-radius: 50%; background: #fff; pointer-events: none; z-index: 20; }
</style>
</head>
<body>
<div class="appbar"><button class="iconbtn hidden" id="backBtn" aria-label="Назад">←</button><h1 id="title">🦭 Тюлений протокол</h1><button class="iconbtn" id="muteTop" aria-label="Звук">🔊</button></div>
<div class="wrap">
  <div id="menu" class="screen on">
    <div class="hero"><div class="ava" id="heroAva"></div><div class="t"><b>Секретный отсек Дроида</b><span id="heroLine">тут я гоняю тюленей, пока вы спите</span></div></div>
    <div class="tiles" id="tiles"></div>
  </div>

  <div id="game" class="screen">
    <div class="player" id="topCard"><div class="ava" id="topAva"></div><span class="who" id="topName"></span><span class="caps" id="topCaps"></span></div>
    <div class="boardwrap"><div id="board"></div><div class="snowfall" id="snowfall"></div></div>
    <div class="player" id="botCard"><div class="ava" id="botAva"></div><span class="who" id="botName"></span><span class="caps" id="botCaps"></span></div>
    <div class="bubble"><div class="ava" id="droidAva"></div><div class="msg" id="msg"><span class="n">Сергей Дроид</span><span id="say"></span></div></div>
    <div class="actions">
      <button class="act" id="undoBtn"><i>↶</i>Ход назад</button>
      <button class="act" id="flipBtn"><i>⇅</i>Развернуть</button>
      <button class="act" id="legendInGame"><i>🦭</i>Кто есть кто</button>
      <button class="act danger" id="quitBtn" aria-label="Сдаться"><i>⚑</i></button>
    </div>
    <button class="btn" id="muteBtn" style="display:none">🔊</button>
  </div>
</div>

<div class="modal" id="chessModal"><div class="card"><div class="sheet-title">Тюленьи шахматы</div><div class="sheet-sub">с кем играем?</div>
  <div class="sheet-sub" style="margin:8px 0 6px;color:var(--text)">Против Дроида — выбери, в какой он форме</div>
  <div class="levels" id="levels"></div>
  <button class="btn" data-start="duo"><b>Вдвоём на одном телефоне</b><span>ходите по очереди, Дроид комментирует</span></button>
  <button class="btn" id="legendBtn"><b>Кто есть кто</b><span>какой тюлень какая фигура</span></button>
</div></div>
<div class="modal" id="quitModal"><div class="card"><div class="sheet-title">Сдаться?</div><div class="sheet-sub">Дроид это запомнит</div>
  <button class="btn" style="text-align:center;color:var(--danger)" id="quitYes">Да, сдаюсь</button>
  <button class="btn" style="text-align:center" id="quitNo">Играем дальше</button></div></div>
<div class="modal" id="promoModal"><div class="card"><h2>Белёк вырос. В кого?</h2><div class="promo" id="promoChoices"></div></div></div>
<div class="modal" id="legendModal"><div class="card"><h2>Кто есть кто</h2><div style="color:var(--muted);font-size:13px;margin:-4px 0 10px">нажми на тюленя — услышишь, как он кричит</div><div class="legend" id="legend"></div>
  <button class="btn main" style="text-align:center;margin-top:14px" id="legendClose">Понял</button></div></div>
<div class="modal" id="endModal"><div class="card"><div class="result" id="endTitle"></div><div id="endText" style="color:var(--muted)"></div>
  <button class="btn main" style="text-align:center;margin-top:14px" id="sendBtn">Отправить Дроиду результат</button>
  <button class="btn" style="text-align:center" id="againBtn">Ещё партию</button></div></div>

<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

// ---------- тюлени ----------
// Только настоящие тюлени и нерпы (без ушастых, моржей и морских леопардов). Белые — светлый окрас, чёрные — тёмный.
const INFO = {
  k: { name: "Хохлач", acc: "хохлача", why: "король: самец раздувает на голове чёрный «капюшон», как корону, и красный пузырь из ноздри" },
  q: { name: "Крылатка", acc: "крылатку", why: "ферзь: самая нарядная — светлые «ленты» через всё тело, как королевская перевязь, и диадема" },
  r: { name: "Кольчатая нерпа", acc: "кольчатую нерпу", why: "ладья: лежит на ледяном торосе с зубцами — как на башне; в тёмных пятнах с едва заметными светлыми кольцами" },
  b: { name: "Морской слон", acc: "морского слона", why: "слон: тут без вариантов — и в митре, как настоящий епископ (bishop)" },
  n: { name: "Лахтак", acc: "лахтака", why: "конь: он же «морской заяц» — а заяц скачет буквой Г; борода из усов и рыцарский плюмаж" },
  p: { name: "Белёк", acc: "белька", why: "пешка: у белых — белоснежный детёныш гренландского тюленя, у чёрных — серый ладожский нерпёнок; при превращении вырастает во взрослую фигуру" },
};

  const rows = s.b.map(r => { let o = "", e = 0; for (const p of r) { if (!p) { e++; continue; } if (e) { o += e; e = 0; } o += p.c === "w" ? p.t.toUpperCase() : p.t; } return o + (e || ""); }).join("/");
  const cs = (s.cs.wK ? "K" : "") + (s.cs.wQ ? "Q" : "") + (s.cs.bK ? "k" : "") + (s.cs.bQ ? "q" : "") || "-";

}

function sfMove(s, lv) {

    const L = LEVELS[lv];
    if (!SF || !sfReady || L.skill == null) return res(null);
    const timer = setTimeout(() => { sfWait = null; res(null); }, L.ms + 4000);
    sfWait = u => { clearTimeout(timer); res(fromUci(s, u)); };
    SF.postMessage(`setoption name Skill Level value ${L.skill}`);
    SF.postMessage(`position fen ${fen(s)}`);
    SF.postMessage(`go movetime ${L.ms}`);

}

// ---------- анимации: прыжок на клетку, брызги, снег, ветер ----------
const rectOf = (r, c) => { const el = boardEl.querySelector(`.sq[data-r="${r}"][data-c="${c}"]`); return el ? el.getBoundingClientRect() : null; };
const rnd = (a, b) => a + Math.random() * (b - a);
function spawn(cls, x, y, w, h) { const d = document.createElement("div"); d.className = cls; Object.assign(d.style, { left: x + "px", top: y + "px" }); if (w) d.style.width = w + "px"; if (h) d.style.height = h + "px"; document.body.appendChild(d); return d; }
function puff(rc) {
  const cx = rc.left + rc.width / 2, by = rc.top + rc.height * .85;
  for (let i = 0; i < 9; i++) {
    const d = spawn("puff", cx - 2, by - 2); const dx = rnd(-1, 1) * rc.width * .45, dy = -rnd(2, rc.height * .18);
    d.animate([{ transform: "translate(0,0) scale(1)", opacity: .95 }, { transform: `translate(${dx}px,${dy}px) scale(.4)`, opacity: 0 }], { duration: rnd(380, 620), easing: "ease-out" }).onfinish = () => d.remove();
  }
}
function splash(rc) {
  const cx = rc.left + rc.width / 2, cy = rc.top + rc.height * .7;
  for (let k = 0; k < 2; k++) {
    const w = rc.width * .5, r = spawn("ripple", cx - w / 2, cy - w / 4, w, w / 2);
    r.animate([{ transform: "scale(.3)", opacity: .95 }, { transform: "scale(1.7)", opacity: 0 }], { duration: 700, delay: k * 180, easing: "ease-out", fill: "backwards" }).onfinish = () => r.remove();
  }
  for (let i = 0; i < 14; i++) {
    const d = spawn("drop", cx - 3, cy - 4); const dx = rnd(-1, 1) * rc.width * .7, up = rnd(.35, .9) * rc.height;
    d.animate([{ transform: "translate(0,0) scale(1)", opacity: 1 }, { transform: `translate(${dx * .6}px,${-up}px) scale(1)`, opacity: 1, offset: .45 },
               { transform: `translate(${dx}px,${rc.height * .1}px) scale(.6)`, opacity: 0 }], { duration: rnd(520, 820), easing: "cubic-bezier(.2,.7,.4,1)" }).onfinish = () => d.remove();
  }
}
function sink(svg, rc) {

  f.animate([{ transform: "translateY(0)", opacity: 1, clipPath: "inset(0 0 0 0)" }, { transform: `translateY(${rc.height * .35}px)`, opacity: 0, clipPath: "inset(0 0 45% 0)" }],

}
function hop(svg, from, to, done) {

  const f = spawn("fly", from.left, from.top, from.width, from.height); f.innerHTML = svg;
  const dx = to.left - from.left, dy = to.top - from.top, dist = Math.hypot(dx, dy), h = Math.min(from.height * .9, 14 + dist * .18);
  f.animate([{ transform: "translate(0,0) scale(1,1)" }, { transform: `translate(${dx * .5}px,${dy * .5 - h}px) scale(1.06,.96)`, offset: .5 },
             { transform: `translate(${dx}px,${dy}px) scale(1.08,.86)`, offset: .9 }, { transform: `translate(${dx}px,${dy}px) scale(1,1)` }],
            { duration: Math.min(560, 300 + dist * .6), easing: "cubic-bezier(.3,.6,.4,1)" }).onfinish = () => { f.remove(); done(); };
}
function snowfall() {
  const box = document.getElementById("snowfall");
  box.innerHTML = Array.from({ length: 14 }, () => `<i class="flake" style="left:${rnd(0, 100)}%;width:${rnd(2, 4.5)}px;height:${rnd(2, 4.5)}px;opacity:${rnd(.45, .9)};--dx:${rnd(-18, 22)}px;animation-duration:${rnd(7, 14)}s;animation-delay:${-rnd(0, 14)}s"></i>`).join("");
}
function whoosh() {
  if (muted || !ac()) return;
  const t = AC.currentTime, n = Math.floor(AC.sampleRate * 2.2), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(), bq = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = buf; bq.type = "bandpass"; bq.Q.value = 1.4; bq.frequency.setValueAtTime(380, t); bq.frequency.linearRampToValueAtTime(1300, t + 1); bq.frequency.linearRampToValueAtTime(500, t + 2.2);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.09, t + .7); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
  src.connect(bq); bq.connect(g); g.connect(AC.destination); src.start(t);
}
function gust() {
  if (!document.getElementById("game").classList.contains("on")) return;
  const rc = boardEl.getBoundingClientRect(); if (!rc.width) return;
  boardEl.classList.add("gust"); setTimeout(() => boardEl.classList.remove("gust"), 2400);
  whoosh();
  for (let i = 0; i < 26; i++) {
    const y = rc.top + rnd(0, rc.height), d = spawn("puff", rc.left - 10, y); const len = rc.width + 30;
    d.animate([{ transform: "translate(0,0)", opacity: 0 }, { opacity: .95, offset: .15 }, { transform: `translate(${len}px,${rnd(-30, 30)}px)`, opacity: 0 }],
              { duration: rnd(1300, 2200), delay: rnd(0, 700), easing: "ease-in-out", fill: "backwards" }).onfinish = () => d.remove();
  }
  for (let i = 0; i < 4; i++) {
    const y = rc.top + rnd(.1, .9) * rc.height, l = spawn("gustline", rc.left - 60, y, rnd(50, 110));
    l.animate([{ transform: "translateX(0)", opacity: 0 }, { opacity: .9, offset: .3 }, { transform: `translateX(${rc.width + 120}px)`, opacity: 0 }],
              { duration: rnd(900, 1500), delay: rnd(0, 600), easing: "ease-in-out", fill: "backwards" }).onfinish = () => l.remove();
  }
}
(function windLoop() { setTimeout(() => { gust(); windLoop(); }, rnd(16000, 38000)); })();

// ---------- игра ----------
let animating = false;
let st, mode, level, sel = null, moves = [], last = null, flipped = false, hist = [], over = false, thinking = false, nmoves = 0;
const capsBy = { w: [], b: [] };
const boardEl = document.getElementById("board");
const NAME = { w: "Белые", b: "Чёрные" };

function start(m) {
  mode = m.startsWith("droid") ? "droid" : "duo"; level = mode === "droid" ? +m.slice(5) : 0;
  if (mode === "droid" && level > 0) sfInit();
  st = initial(); sel = null; moves = []; last = null; flipped = false; hist = []; over = false; thinking = false; nmoves = 0;
  capsBy.w = []; capsBy.b = [];
  show("game");
  say(pick(mode === "droid" ? LINES.start : LINES.startDuo));
  hide("chessModal");
  render(); snowfall();
  boardEl.querySelectorAll(".sq").forEach((sq, i) => { if (sq.querySelector(".pc")) { sq.classList.add("enter"); sq.querySelector(".pc").style.animationDelay = (Math.floor(i / 8) % 4) * 60 + (i % 8) * 25 + "ms"; } });
  setTimeout(() => boardEl.querySelectorAll(".sq.enter").forEach(sq => sq.classList.remove("enter")), 1200);
}
function show(id) {
  for (const el of document.querySelectorAll(".screen")) el.classList.toggle("on", el.id === id);
  const inGame = id !== "menu";
  document.getElementById("backBtn").classList.toggle("hidden", !inGame);
  document.getElementById("title").textContent = inGame ? "🦭 Тюленьи шахматы" : "🦭 Тюлений протокол";
  if (tg && tg.BackButton) try { inGame ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
  if (!inGame) document.getElementById("droidAva").innerHTML = seal("k", "b");
renderHub();
}
function openSheet(id) { document.getElementById(id).classList.add("on"); }
document.querySelectorAll(".modal").forEach(m => m.addEventListener("click", e => { if (e.target === m && m.id !== "endModal" && m.id !== "promoModal") m.classList.remove("on"); }));
function names() {
  if (mode === "droid") return { w: "Ты (белые)", b: `Сергей Дроид · ${LEVELS[level].name.toLowerCase()}` };
  return { w: "Белые", b: "Чёрные" };
}
function render() {
  const nm = names(), bottom = flipped ? "b" : "w", top = opp(bottom);
  document.getElementById("topName").textContent = nm[top];
  document.getElementById("botName").textContent = nm[bottom];
  document.getElementById("topCard").classList.toggle("turn", st.turn === top && !over);
  document.getElementById("botCard").classList.toggle("turn", st.turn === bottom && !over);
  document.getElementById("topAva").innerHTML = seal(mode === "droid" && top === "b" ? "k" : "p", top);
  document.getElementById("botAva").innerHTML = seal(mode === "droid" && bottom === "b" ? "k" : "p", bottom);
  document.getElementById("topCaps").innerHTML = capsBy[top].map(p => seal(p.t, p.c)).join("");
  document.getElementById("botCaps").innerHTML = capsBy[bottom].map(p => seal(p.t, p.c)).join("");
  const chk = inCheck(st, st.turn) ? kingPos(st, st.turn) : null;
  let html = "";
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
    const r = flipped ? 7 - i : i, c = flipped ? 7 - j : j, p = st.b[r][c];
    const cls = ["sq", (r + c) % 2 ? "d" : "l"];
    if (last && ((last.fr === r && last.fc === c) || (last.tr === r && last.tc === c))) cls.push("last");
    if (sel && sel[0] === r && sel[1] === c) cls.push("sel");
    if (chk && chk[0] === r && chk[1] === c) cls.push("chk");
    const mv = moves.find(m => m.tr === r && m.tc === c);
    if (mv) cls.push(p || mv.ep ? "cap" : "mv");
    let co = "";
    if (i === 7) co += `<span class="coord f">${"abcdefgh"[c]}</span>`;
    if (j === 0) co += `<span class="coord r">${8 - r}</span>`;
    html += `<div class="${cls.join(" ")}" data-r="${r}" data-c="${c}">${co}${p ? seal(p.t, p.c) : ""}</div>`;
  }
  boardEl.innerHTML = html;
}
boardEl.addEventListener("click", e => {
  const sq = e.target.closest(".sq"); if (!sq || over || thinking || animating) return;
  if (mode === "droid" && st.turn !== "w") return;
  const r = +sq.dataset.r, c = +sq.dataset.c, p = st.b[r][c];
  const opts = moves.filter(m => m.tr === r && m.tc === c);
  if (sel && opts.length) {
    if (opts.length > 1) return askPromo(opts);
    return play(opts[0]);
  }
  if (p && p.c === st.turn) { sel = [r, c]; moves = legal(st).filter(m => m.fr === r && m.fc === c); }
  else { sel = null; moves = []; }
  render();
});
function askPromo(opts) {
  const box = document.getElementById("promoChoices");
  box.innerHTML = "";
  for (const t of "qrbn") {
    const b = document.createElement("button");
    b.innerHTML = seal(t, st.turn); b.title = INFO[t].name;
    b.onclick = () => { hide("promoModal"); play(opts.find(m => m.promo === t)); };
    box.appendChild(b);
  }
  document.getElementById("promoModal").classList.add("on");
}
function hide(id) { document.getElementById(id).classList.remove("on"); }

function play(m) {
  const mover = st.turn, piece = st.b[m.fr][m.fc];
  const from = rectOf(m.fr, m.fc), to = rectOf(m.tr, m.tc), capAt = m.ep ? rectOf(m.fr, m.tc) : to;
  hist.push({ st, last, caps: { w: capsBy.w.slice(), b: capsBy.b.slice() }, nmoves });
  if (m.cap) capsBy[mover].push(m.cap);
  st = make(st, m); last = m; sel = null; moves = []; nmoves++;
  const moved = m.promo || st.b[m.tr][m.tc].t;
  voice(moved, !!m.cap);
  if (tg && tg.HapticFeedback) try { tg.HapticFeedback.impactOccurred(m.cap ? "medium" : "light"); } catch (e) {}
  comment(m, mover);
  animating = true;
  render();
  const dest = boardEl.querySelector(`.sq[data-r="${m.tr}"][data-c="${m.tc}"] .pc`);
  if (dest) dest.style.visibility = "hidden";
  if (m.cap && capAt) sink(seal(m.cap.t, m.cap.c), capAt);
  hop(seal(piece.t, piece.c), from, to, () => {
    if (dest) dest.style.visibility = "";
    if (to) (m.cap ? splash : puff)(to);
    animating = false;
    const end = status(st);

  });
}
function comment(m, mover) {
  const chk = inCheck(st, st.turn);
  if (mode === "droid") {
    if (mover === "b") {
      if (chk) return say(pick(LINES.iCheck));
      if (m.cap) return say(pick(LINES.iTake(INFO[m.cap.t].acc)));
      if (m.promo) return say(pick(LINES.promo));
      return say(pick(["твой ход", "ну", "давай-давай", "я жду, органика", "ход сделан. не благодари"]));
    }
    if (chk) return say(pick(LINES.youCheck));
    if (m.cap) return say(pick(LINES.youTake(INFO[m.cap.t].acc)));
    return;
  }
  if (chk) return say(pick(LINES.duoCheck(NAME[mover])));
  if (m.cap) return say(pick(LINES.duoTake(NAME[mover], INFO[m.cap.t].acc)));

}
function droidTurn() {

  const t0 = Date.now();
  const go = m => setTimeout(() => { thinking = false; if (m) play(m); }, Math.max(0, 350 - (Date.now() - t0)));
  if (level === 0) return go(bestMove(st, 0));
  sfMove(st, level).then(m => go(m || bestMove(st, 1)));  // Stockfish не ответил — свой движок
}
let result = null;
function finish(kind, resigned) {
  over = true; render();
  let title, text, line;
  if (kind === "mate" || resigned) {
    const winner = resigned ? opp(resigned) : opp(st.turn);
    if (mode === "droid") {
      result = winner === "w" ? "win" : "loss";
      title = result === "win" ? "Ты победил" : "Дроид победил";
      line = pick(resigned ? LINES.resign : result === "win" ? LINES.youWin : LINES.iWin);
    } else {
      result = winner; title = `${NAME[winner]} победили`; line = pick(resigned ? LINES.resign : ["мат. тюлени плачут", `мат. ${NAME[winner]} молодцы, остальные в мусорку`]);
    }
    text = resigned ? "сдача" : "мат";
  } else {
    result = "draw"; title = "Ничья";
    text = { stalemate: "пат", material: "некому ставить мат", fifty: "50 ходов без толку" }[kind];
    line = pick(LINES.draw);
  }
  say(line);
  document.getElementById("endTitle").textContent = title;
  document.getElementById("endText").textContent = `${text}, ходов: ${Math.ceil(nmoves / 2)}. Дроид: «${line}»`;
  document.getElementById("sendBtn").style.display = tg && tg.initData !== undefined && tg.platform !== "unknown" ? "block" : "none";
  if (result === "win" || mode === "duo") confetti();
  setTimeout(() => document.getElementById("endModal").classList.add("on"), 600);
  lastEnd = { kind: resigned ? "resign" : kind };
}
let lastEnd = null;

document.getElementById("levels").innerHTML = LEVELS.map((L, i) =>
  `<button class="btn${i === 3 ? " main" : ""}" data-start="droid${i}"><b>${L.name}</b><span>${L.sub}</span></button>`).join("");
const GAMES = [
  { id: "chess", title: "Тюленьи шахматы", sub: "против Дроида или вдвоём", art: ["k", "w"], hot: true },
  { id: "solitaire", title: "Тюлений пасьянс", sub: "косынка с тюленями", art: ["q", "w"], soon: true },
];
const HERO_LINES = ["тут я гоняю тюленей, пока вы спите", "секретный протокол. никому ни слова", "реактор прогрет. выбирай игру, органика"];
function renderHub() {
  document.getElementById("heroAva").innerHTML = seal("p", "w");
  document.getElementById("heroLine").textContent = pick(HERO_LINES);
  const going = st && !over && hist.length;
  document.getElementById("tiles").innerHTML = GAMES.map(g => `<button class="tile${g.soon ? " soon" : ""}${g.hot ? " hot" : ""}" data-game="${g.id}">
    ${g.soon ? '<span class="badge">СКОРО</span>' : going && g.id === "chess" ? '<span class="badge" style="color:var(--accent)">ПАРТИЯ ИДЁТ</span>' : ""}
    <div class="art">${seal(g.art[0], g.art[1])}</div><b>${g.title}</b><span>${g.id === "chess" && going ? "нажми, чтобы продолжить" : g.sub}</span></button>`).join("");
}
document.getElementById("tiles").addEventListener("click", e => {
  const t = e.target.closest(".tile"); if (!t || t.classList.contains("soon")) return;
  if (t.dataset.game === "chess") {

  }
});
document.getElementById("backBtn").onclick = () => show("menu");
if (tg && tg.BackButton) try { tg.BackButton.onClick(() => show("menu")); } catch (e) {}
document.getElementById("legendInGame").onclick = () => document.getElementById("legendBtn").click();
document.getElementById("muteTop").onclick = () => document.getElementById("muteBtn").click();
document.getElementById("quitYes").onclick = () => { hide("quitModal"); finish(null, mode === "droid" ? "w" : st.turn); };
document.getElementById("quitNo").onclick = () => hide("quitModal");
function confetti() {
  for (let i = 0; i < 46; i++) {
    const d = document.createElement("div"); d.className = "confetti";
    d.style.left = rnd(0, 100) + "vw"; d.style.width = d.style.height = rnd(4, 9) + "px";
    d.style.background = pick(["#ffffff", "#bfe3f5", "#f2c14e", "#9ed8ff"]);
    document.body.appendChild(d);
    d.animate([{ transform: "translate(0,0) rotate(0)" }, { transform: `translate(${rnd(-60, 60)}px, 105vh) rotate(${rnd(180, 720)}deg)` }],
              { duration: rnd(1800, 3200), delay: rnd(0, 500), easing: "cubic-bezier(.3,.1,.5,1)" }).onfinish = () => d.remove();
  }
}
renderHub();
document.querySelectorAll("[data-start]").forEach(b => b.onclick = () => start(b.dataset.start));
document.getElementById("flipBtn").onclick = () => { flipped = !flipped; render(); };
document.getElementById("undoBtn").onclick = () => {
  if (over || thinking || animating || !hist.length) return;

  let h; for (let i = 0; i < back && hist.length; i++) h = hist.pop();
  st = h.st; last = h.last; capsBy.w = h.caps.w; capsBy.b = h.caps.b; nmoves = h.nmoves; sel = null; moves = [];
  say(pick(LINES.undo)); render();
};
document.getElementById("quitBtn").onclick = () => {
  if (over || !hist.length) return show("menu");
  openSheet("quitModal");
};
document.getElementById("againBtn").onclick = () => { hide("endModal"); show("menu"); openSheet("chessModal"); };
document.getElementById("sendBtn").onclick = () => {
  const data = { g: "seals", mode, lvl: level, lvlName: mode === "droid" ? LEVELS[level].name : "", result, end: lastEnd && lastEnd.kind, moves: Math.ceil(nmoves / 2) };
  try { tg.sendData(JSON.stringify(data)); } catch (e) { say("не отправилось: открой игру кнопкой у Дроида в лс"); hide("endModal"); }
};
document.getElementById("legendBtn").onclick = () => {
  document.getElementById("legend").innerHTML = "kqrbnp".split("").map(t =>
    `<div data-t="${t}" style="cursor:pointer">${seal(t, "w")}</div><div data-t="${t}" style="cursor:pointer"><b>${INFO[t].name} 🔊</b><span>${INFO[t].why}</span></div>`).join("");
  document.getElementById("legendModal").classList.add("on");
};
const muteBtn = document.getElementById("muteBtn");
muteBtn.textContent = muted ? "🔇" : "🔊"; document.getElementById("muteTop").textContent = muted ? "🔇" : "🔊";
muteBtn.onclick = () => { muted = !muted; muteBtn.textContent = muted ? "🔇" : "🔊"; document.getElementById("muteTop").textContent = muted ? "🔇" : "🔊"; try { localStorage.setItem("seals_mute", muted ? "1" : "0"); } catch (e) {} if (!muted) voice("p"); };
document.getElementById("legend").addEventListener("click", e => { const row = e.target.closest("[data-t]"); if (row) { const was = muted; muted = false; voice(row.dataset.t); muted = was; } });
document.getElementById("legendClose").onclick = () => hide("legendModal");
window.__seals = { initial, legal, make, status, bestMove, inCheck }; // для проверки
</script>
